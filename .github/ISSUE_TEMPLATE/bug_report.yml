name: Example does not work
description: An example fails, is out of date or gives a wrong result
labels: [bug]
body:
  - type: input
    id: example
    attributes:
      label: Which example?
      placeholder: rest-api/python/feedback_pulse.py
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Paste the error or the API response. Remove your API key first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Language or framework version
      placeholder: Python 3.12, Node 22, Next.js 15...
