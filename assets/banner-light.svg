<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="F-Pulse App examples: feedback widget, REST API and webhooks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.45" r="0.45"><stop offset="0" stop-color="#0B0D1A" stop-opacity="0"/><stop offset="1" stop-color="#0B0D1A" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity="0.05"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/></filter>
    <clipPath id="logoclip"><rect x="72" y="88" width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow)"/>
  <image href="data:image/png;base64," x="72" y="88" width="64" height="64" clip-path="url(#logoclip)"/>
  <text x="152" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B0D1A" letter-spacing="1.2">F-PULSE APP</text>
  <text x="152" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B0D1A">Examples</text>
  <text x="72" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0B0D1A">User feedback in your product,</text>
  <text x="72" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0B0D1A">in a few lines of code.</text>
  <text x="72" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#5A5D74">Widget, REST API clients and webhooks, ready to copy.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="72" y="320" width="128" height="32" rx="16" fill="#D7FF3A"/><text x="136" y="341" text-anchor="middle" fill="#0B0D1A">13 languages</text>
    <rect x="210" y="320" width="196" height="32" rx="16" fill="#D7FF3A"/><text x="308" y="341" text-anchor="middle" fill="#0B0D1A">Widget · API · Webhooks</text>
    <rect x="416" y="320" width="110" height="32" rx="16" fill="#D7FF3A"/><text x="471" y="341" text-anchor="middle" fill="#0B0D1A">MIT license</text>
  </g>
  <g transform="translate(616,58)" filter="url(#shadow)">
    <rect width="560" height="250" rx="14" fill="#f6f8fa" stroke="#E1E2E8"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
    <text x="280" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5A5D74">quickstart</text>
    <line x1="0" y1="44" x2="560" y2="44" stroke="#E1E2E8"/>
    <text x="24" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#6e7781">&lt;!-- Add feedback to any website --&gt;</tspan></text><text x="24" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#cf222e">&lt;script</tspan><tspan fill="#116329"> src</tspan><tspan fill="#0B0D1A">=</tspan><tspan fill="#0a3069">"https://fpulse.app/w/fp_…js"</tspan><tspan fill="#116329"> async</tspan><tspan fill="#cf222e">&gt;&lt;/script&gt;</tspan></text><text x="24" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"></text><text x="24" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#6e7781"># Or send it from your app</tspan></text><text x="24" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#0B0D1A">curl -X POST </tspan><tspan fill="#0a3069">api.fpulse.app/v1/feedback</tspan></text><text x="24" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#0B0D1A">  -H </tspan><tspan fill="#0a3069">"X-API-Key: fp_…"</tspan></text><text x="24" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#0B0D1A">  -d </tspan><tspan fill="#0a3069">'{"sentiment": "positive"}'</tspan></text>
  </g>
  <g transform="translate(1030,222)" filter="url(#shadow)">
    <rect width="220" height="150" rx="14" fill="#ffffff" stroke="#E1E2E8"/>
    <path d="M0,14 a14,14 0 0 1 14,-14 h192 a14,14 0 0 1 14,14 v34 h-220z" fill="#059669"/>
    <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">How was your experience?</text>
    <circle cx="80" cy="82" r="22" fill="#D7FF3A"/>
    <path d="M71,86 h4 v-9 h-4z M77,86 h10 l3,-8 h-7 l1,-6 c0,-2 -3,-3 -4,0 z" fill="#0B0D1A"/>
    <circle cx="140" cy="82" r="22" fill="#D7FF3A"/>
    <path d="M149,78 h-4 v9 h4z M143,78 h-10 l-3,8 h7 l-1,6 c0,2 3,3 4,0 z" fill="#dc2626"/>
    <rect x="16" y="114" width="188" height="22" rx="6" fill="#D7FF3A"/>
    <text x="26" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5A5D74">Tell us more (optional)…</text>
  </g>
</svg>
